<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DECIDE v1.5 画面カタログ</title><link rel="stylesheet" href="fonts/noto-sans-jp.css"><link rel="stylesheet" href="catalog.css"></head><body>
<header class="catalog-head"><div><small>DESIGN HANDOFF / 1.5</small><h1>DECIDE</h1></div><p>画面設計見本・架空データ<br>認証・送信・サーバー保存は行いません</p></header>
<main class="workbench"><aside class="inspector"><h2>画面を確認</h2><label>画面<select id="screen-select"></select></label><label>代表状態<select id="state-select"><option value="default">通常</option><option value="owner">作者・受付中（詳細）</option><option value="closed">終了・同数（詳細）</option><option value="zero">終了・回答なし（詳細）</option><option value="anonymous">匿名相談（詳細）</option><option value="long">長い日本語</option><option value="loading">読み込み中</option><option value="empty">空の状態</option><option value="error">通信エラー</option></select></label><div class="two"><label>テーマ<select id="theme-select"><option>light</option><option>dark</option></select></label><label>画面幅<select id="width-select"><option>390</option><option>320</option><option>414</option></select></label></div><label>文字<select id="scale-select"><option value="1">100%</option><option value="2">200%</option></select></label><label>シート<select id="overlay-select"><option value="">閉じる</option><option value="O01">O01 写真・位置</option><option value="O02">O02 期限</option><option value="O03">O03 友達選択</option><option value="O04">O04 ひとこと</option><option value="O05">O05 メニュー</option><option value="O06">O06 回答者</option><option value="O07">O07 投票変更</option><option value="O08">O08 削除・終了</option><option value="O09">O09 カテゴリ</option><option value="O10">O10 Review延期</option></select></label><div id="annotation"></div><p class="fine">左の操作はカタログ専用です。本文仕様・APIの権限を優先してください。</p></aside>
<section class="stage"><div class="phone" id="phone"><div class="statusbar" aria-hidden="true"><b>9:41</b><span>● ● ▰</span></div><div id="app"></div><div id="toast" role="status" aria-live="polite"></div></div><p id="caption"></p></section></main>
<dialog id="sheet" aria-labelledby="sheet-title"><div id="sheet-body"></div></dialog><script src="catalog-data.js"></script><script src="catalog.js"></script></body></html>
